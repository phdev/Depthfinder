<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Depthfinder — home-center</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/summary.css" />
    <style>
      /* Context + Tokens + Drift tabs = the FULL design pages (public/context.html,
         public/tokens.html, public/drift.html) in an iframe. On those tabs the SPA
         chrome is hidden (body.embed-active) so the design's own
         nav/health/dimensions/ELI10 lead — its nav links target _parent to drive the
         other SPA tabs. The legacy panel bodies stay in the DOM for app.js's refs but
         are force-hidden. */
      #panel-graph, #panel-tokens, #panel-drift, #panel-coverage { padding: 0 !important; }
      #panel-graph .panel-grid, #panel-tokens .tokens-legacy, #panel-drift .drift-legacy, #panel-coverage .coverage-legacy { display: none !important; }
      .ctx-frame { width: 100%; height: 100dvh; border: 0; display: block; background: #000; }
      body.embed-active .topnav { display: none !important; }

      /* Top nav matched to the design pages (Context/Tokens/Drift) — replaces the
         old .topbar + .tabs two-bar chrome with the design's single-row .topnav.
         Self-contained literal colors (resolved from context-base.css tokens) so it
         needs no extra stylesheet and can't restyle the native Summary content. */
      .topnav { border-bottom: 1px solid #1b2330; position: sticky; top: 0; z-index: 20; background: rgba(7,10,15,.82); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
      .topnav .row { display: flex; align-items: center; gap: 26px; height: 60px; max-width: 1200px; margin: 0 auto; padding: 0 40px; }
      .topnav .burger { display: none; flex-direction: column; gap: 4px; padding: 4px; cursor: pointer; background: none; border: 0; }
      .topnav .burger i { width: 18px; height: 1.5px; background: #9aa7b7; display: block; border-radius: 2px; }
      .topnav .nav-logo { display: flex; align-items: center; gap: 10px; color: #eaf0f7; text-decoration: none; }
      .topnav .sonar { position: relative; width: 24px; height: 24px; flex: 0 0 auto; }
      .topnav .sonar i { position: absolute; inset: 0; margin: auto; border-radius: 50%; border: 1.5px solid #e6ecf4; }
      .topnav .sonar i:nth-child(1) { width: 6px; height: 6px; background: #e6ecf4; border: none; box-shadow: 0 0 8px #e6ecf4; }
      .topnav .sonar i:nth-child(2) { width: 14px; height: 14px; opacity: .6; }
      .topnav .sonar i:nth-child(3) { width: 22px; height: 22px; opacity: .28; }
      .topnav .nav-logo b { font-weight: 700; letter-spacing: .01em; }
      .topnav .nav-tabs { display: flex; gap: 2px; height: 100%; margin-left: 6px; }
      .topnav .nav-tab { display: flex; align-items: center; height: 100%; padding: 0 16px; color: #5d6878; font-size: 13px; border-bottom: 2px solid transparent; cursor: pointer; text-decoration: none; }
      .topnav .nav-tab:hover { color: #9aa7b7; }
      .topnav .nav-tab.on { color: #eaf0f7; border-bottom-color: #e6ecf4; }
      .topnav .nav-spacer { flex: 1; }
      .topnav .refresh-btn { background: none; border: 0; color: #9aa7b7; font-size: 20px; line-height: 1; cursor: pointer; padding: 4px 6px; }
      .topnav .refresh-btn:hover { color: #eaf0f7; }
      .topnav .refresh-btn.spin { animation: dfspin .8s linear infinite; }
      .topnav .badge-local { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; font-size: 11px; color: #9aa7b7; border: 1px solid #27313f; border-radius: 999px; padding: 5px 12px 5px 10px; letter-spacing: .05em; }
      .topnav .badge-local::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #9aa7b7; box-shadow: 0 0 7px #9aa7b7; }
      @media (max-width: 760px) {
        .topnav .burger { display: flex; }
        .topnav .nav-tabs { display: none; position: absolute; top: 60px; left: 0; right: 0; flex-direction: column; height: auto; background: #05080d; border-bottom: 1px solid #1b2330; padding: 6px 0; }
        .topnav .nav-tabs.open { display: flex; }
        .topnav .nav-tab { height: auto; padding: 11px 40px; border-bottom: none; }
        .topnav .row { padding: 0 20px; gap: 14px; }
      }
    </style>
  </head>
  <body>
    <!-- Top nav matched to the design pages: single-row .topnav with sonar logo,
         text tabs (Summary · Context · Tokens · Drift · Evals), and local-only badge.
         The nav-tabs are hash anchors — clicking sets location.hash, which the
         existing hashchange listener turns into activate(); data-panel maps the
         anchor to its SPA panel. -->
    <header class="topnav">
      <div class="wrap row">
        <button class="burger" id="navBurger" aria-label="Menu"><i></i><i></i><i></i></button>
        <a class="nav-logo" href="#summary"><span class="sonar"><i></i><i></i><i></i></span><b>Depthfinder</b></a>
        <nav class="nav-tabs" id="tabs">
          <a class="nav-tab on" href="#summary" data-panel="summary">Summary</a>
          <a class="nav-tab" href="#context" data-panel="graph">Context</a>
          <a class="nav-tab" href="#tokens" data-panel="tokens">Tokens</a>
          <a class="nav-tab" href="#drift" data-panel="drift">Drift</a>
          <a class="nav-tab" href="#evals" data-panel="coverage">Evals</a>
        </nav>
        <span class="nav-spacer"></span>
        <button class="refresh-btn" id="globalRefresh" aria-label="Refresh" title="Refresh this panel">↻</button>
        <span class="badge-local">local-only</span>
      </div>
    </header>

    <!-- ── Panel 0: Summary / triage ────────────────────────────────────── -->
    <section class="panel active" id="panel-summary">
      <div class="placeholder" id="summaryBody">Loading…</div>
    </section>

    <!-- ── Panel 1: Context graph ───────────────────────────────────────── -->
    <!-- The Context tab now renders the design's page (public/context.html) in an
         embed iframe. The legacy Cytoscape grid below is kept in the DOM but hidden
         so app.js's element refs (#cy, #refreshMap, …) stay valid; loadGraph()
         early-returns when #ctxFrame exists. -->
    <section class="panel" id="panel-graph">
      <iframe class="ctx-frame" id="ctxFrame" src="/context.html" title="Context"></iframe>
      <div class="panel-grid" hidden>
        <aside class="sidebar">
          <div class="controls">
            <div class="row">
              <button id="refreshMap" class="btn">↻ Refresh</button>
              <select id="layoutPreset" class="select" title="Focus">
                <option value="full">Full graph</option>
                <option value="boundary">Boundary focus</option>
                <option value="loaded">Loaded context only</option>
                <option value="docs">Docs &amp; prompts</option>
              </select>
            </div>
            <input id="search" class="search" placeholder="Search nodes…" />
          </div>

          <div class="budget" id="budget"></div>

          <div class="legend">
            <h3>Node types</h3>
            <div id="typeFilters" class="filters"></div>
            <h3>Load behavior</h3>
            <div id="loadFilters" class="filters"></div>
            <h3>Edges</h3>
            <div id="edgeLegend" class="filters"></div>
          </div>

          <div class="findings" id="findings"></div>
        </aside>

        <div class="canvas-wrap">
          <div id="cy"></div>
          <div class="detail" id="detail">
            <div class="detail-empty">Tap a node to inspect it.</div>
          </div>
        </div>
      </div>
    </section>

    <!-- ── Panel 2: Token budget ────────────────────────────────────────── -->
    <!-- The Tokens tab now renders the design's "Token Currents" page
         (public/tokens.html) in an embed iframe. The legacy token body is kept in
         the DOM (hidden) so app.js refs (#tokensBody) stay valid; loadTokens()
         early-returns when #tokensFrame exists. -->
    <section class="panel" id="panel-tokens">
      <iframe class="ctx-frame" id="tokensFrame" src="/tokens.html" title="Tokens"></iframe>
      <div class="tokens-legacy"><div class="placeholder" id="tokensBody">Loading…</div></div>
    </section>

    <!-- ── Panel 3: Eval coverage ───────────────────────────────────────── -->
    <!-- The Evals tab now renders the design's "Protection chain" page
         (public/evals.html) in an embed iframe. The legacy coverage body is kept in
         the DOM (hidden) so app.js refs (#coverageBody) stay valid; loadCoverage()
         early-returns when #coverageFrame exists. -->
    <section class="panel" id="panel-coverage">
      <iframe class="ctx-frame" id="coverageFrame" src="/evals.html" title="Evals"></iframe>
      <div class="coverage-legacy"><div class="placeholder" id="coverageBody">Loading…</div></div>
    </section>

    <!-- ── Panel 4: Drift ───────────────────────────────────────────────── -->
    <!-- The Drift tab now renders the design's "Drift chain" page
         (public/drift.html) in an embed iframe. The legacy drift body is kept in
         the DOM (hidden) so app.js refs (#driftBody) stay valid; loadDrift()
         early-returns when #driftFrame exists. -->
    <section class="panel" id="panel-drift">
      <iframe class="ctx-frame" id="driftFrame" src="/drift.html" title="Drift"></iframe>
      <div class="drift-legacy"><div class="placeholder" id="driftBody">Loading…</div></div>
    </section>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.2/cytoscape.min.js"></script>
    <script src="/app.js"></script>
    <script src="/project-nav.js?v=1"></script>
  </body>
</html>
