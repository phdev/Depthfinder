<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Depthfinder — home-center</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/summary.css" />
    <style>
      /* Context + Tokens + Drift tabs = the FULL design pages (public/context.html,
         public/tokens.html, public/drift.html) in an iframe. On those tabs the SPA
         chrome is hidden (body.embed-active) so the design's own
         nav/health/dimensions/ELI10 lead — its nav links target _parent to drive the
         other SPA tabs. The legacy panel bodies stay in the DOM for app.js's refs but
         are force-hidden. */
      #panel-graph, #panel-tokens, #panel-drift { padding: 0 !important; }
      #panel-graph .panel-grid, #panel-tokens .tokens-legacy, #panel-drift .drift-legacy { display: none !important; }
      .ctx-frame { width: 100%; height: 100dvh; border: 0; display: block; background: #000; }
      body.embed-active .topbar, body.embed-active .tabs { display: none !important; }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <img class="logo" src="/assets/depthfinder-logo.svg" alt="Depthfinder" />
        <div class="brand-name">Depthfinder</div>
        <div class="pill"><span class="pill-dot"></span>local-only</div>
      </div>
      <button class="refresh-btn" id="globalRefresh" aria-label="Refresh" title="Refresh this panel">↻</button>
    </header>
    <nav class="tabs" id="tabs">
      <button class="tab active" data-panel="summary"><span class="t-num">0</span><span class="t-full">Summary</span><span class="t-short">Summary</span></button>
      <button class="tab" data-panel="graph"><span class="t-num">1</span><span class="t-full">Context</span><span class="t-short">Context</span></button>
      <button class="tab" data-panel="tokens"><span class="t-num">2</span><span class="t-full">Tokens</span><span class="t-short">Tokens</span></button>
      <button class="tab" data-panel="drift"><span class="t-num">3</span><span class="t-full">Drift</span><span class="t-short">Drift</span></button>
      <button class="tab" data-panel="coverage"><span class="t-num">4</span><span class="t-full">Evals</span><span class="t-short">Evals</span></button>
    </nav>

    <!-- ── Panel 0: Summary / triage ────────────────────────────────────── -->
    <section class="panel active" id="panel-summary">
      <div class="placeholder" id="summaryBody">Loading…</div>
    </section>

    <!-- ── Panel 1: Context graph ───────────────────────────────────────── -->
    <!-- The Context tab now renders the design's page (public/context.html) in an
         embed iframe. The legacy Cytoscape grid below is kept in the DOM but hidden
         so app.js's element refs (#cy, #refreshMap, …) stay valid; loadGraph()
         early-returns when #ctxFrame exists. -->
    <section class="panel" id="panel-graph">
      <iframe class="ctx-frame" id="ctxFrame" src="/context.html" title="Context"></iframe>
      <div class="panel-grid" hidden>
        <aside class="sidebar">
          <div class="controls">
            <div class="row">
              <button id="refreshMap" class="btn">↻ Refresh</button>
              <select id="layoutPreset" class="select" title="Focus">
                <option value="full">Full graph</option>
                <option value="boundary">Boundary focus</option>
                <option value="loaded">Loaded context only</option>
                <option value="docs">Docs &amp; prompts</option>
              </select>
            </div>
            <input id="search" class="search" placeholder="Search nodes…" />
          </div>

          <div class="budget" id="budget"></div>

          <div class="legend">
            <h3>Node types</h3>
            <div id="typeFilters" class="filters"></div>
            <h3>Load behavior</h3>
            <div id="loadFilters" class="filters"></div>
            <h3>Edges</h3>
            <div id="edgeLegend" class="filters"></div>
          </div>

          <div class="findings" id="findings"></div>
        </aside>

        <div class="canvas-wrap">
          <div id="cy"></div>
          <div class="detail" id="detail">
            <div class="detail-empty">Tap a node to inspect it.</div>
          </div>
        </div>
      </div>
    </section>

    <!-- ── Panel 2: Token budget ────────────────────────────────────────── -->
    <!-- The Tokens tab now renders the design's "Token Currents" page
         (public/tokens.html) in an embed iframe. The legacy token body is kept in
         the DOM (hidden) so app.js refs (#tokensBody) stay valid; loadTokens()
         early-returns when #tokensFrame exists. -->
    <section class="panel" id="panel-tokens">
      <iframe class="ctx-frame" id="tokensFrame" src="/tokens.html" title="Tokens"></iframe>
      <div class="tokens-legacy"><div class="placeholder" id="tokensBody">Loading…</div></div>
    </section>

    <!-- ── Panel 3: Eval coverage ───────────────────────────────────────── -->
    <section class="panel" id="panel-coverage">
      <div class="placeholder" id="coverageBody">Loading…</div>
    </section>

    <!-- ── Panel 4: Drift ───────────────────────────────────────────────── -->
    <!-- The Drift tab now renders the design's "Drift chain" page
         (public/drift.html) in an embed iframe. The legacy drift body is kept in
         the DOM (hidden) so app.js refs (#driftBody) stay valid; loadDrift()
         early-returns when #driftFrame exists. -->
    <section class="panel" id="panel-drift">
      <iframe class="ctx-frame" id="driftFrame" src="/drift.html" title="Drift"></iframe>
      <div class="drift-legacy"><div class="placeholder" id="driftBody">Loading…</div></div>
    </section>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.2/cytoscape.min.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
