name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Fixture materialization shells out to git; make identity deterministic
      # everywhere (tests also set env, this is belt-and-suspenders for CI).
      - name: Configure git identity
        run: |
          git config --global user.name depthfinder-ci
          git config --global user.email ci@depthfinder.invalid
      - name: Run test suite
        run: npm test
