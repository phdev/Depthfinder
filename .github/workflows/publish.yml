name: Publish to npm

# Publishes on version tags (v0.1.0, v1.2.3…). Requires the NPM_TOKEN secret
# (an npm automation token) configured in the repo settings.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Configure git identity
        run: |
          git config --global user.name depthfinder-ci
          git config --global user.email ci@depthfinder.invalid
      - name: Run test suite
        run: npm test
      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
